name: ci

# Linux, Windows (MSVC) and macOS: checks, then native bundles validated with
# clap-validator and pluginval, then (main only) the rolling `nightly`
# pre-release (`extend-ci-windows-linux-macos`).

on:
  push:
    branches:
      - dev
      - main
      - web
  pull_request:
  # Run by hand (Actions → ci → Run workflow). On main it also refreshes the
  # nightly pre-release.
  workflow_dispatch:

# A newer push to a branch cancels that branch's run, except on main, whose
# runs may be publishing the nightly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # `.cargo/config.toml` builds into ../corrosion-target for the maintainer's
  # machine; inside the workspace the cache action can keep it.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  # Pinned validator releases (bundle job).
  CLAP_VALIDATOR_VERSION: "0.3.2"
  PLUGINVAL_VERSION: "v1.0.4"

defaults:
  run:
    # Git Bash on Windows, so every step and script is the same bash.
    shell: bash

jobs:
  # Every lane of the local close-out that applies to the platform.
  checks:
    name: checks (${{ matrix.platform }})
    # A pull request from a branch of this repository is already tested by
    # that branch's push run; only pull requests from forks run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            # The no-GUI CI lane runs on musl, as documented in CLAUDE.md;
            # the GUI lane, renderer and real-time checks on gnu.
            target: x86_64-unknown-linux-musl
            native: x86_64-unknown-linux-gnu
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            native: x86_64-pc-windows-msvc
          - platform: macos
            os: macos-latest
            target: aarch64-apple-darwin
            native: aarch64-apple-darwin
    env:
      # The config's default target is the maintainer's windows-gnu host.
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The `x11` crate probes many X11 libraries via pkg-config, and GL via
      # gl.pc; egui-baseview and xkbcommon add their own.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libx11-dev libx11-xcb-dev libxau-dev libxcb1-dev \
            libxcursor-dev libxext-dev libxfixes-dev libxft-dev libxi-dev \
            libxinerama-dev libxkbcommon-dev libxrandr-dev libxrender-dev \
            libxtst-dev libxxf86vm-dev libgl-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}, ${{ matrix.native }}
          components: clippy, rustfmt

      - name: Cache Cargo registry and target dir
        uses: Swatinem/rust-cache@v2
        with:
          key: checks-${{ matrix.platform }}

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy (workspace, no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Test workspace (no default features)
        run: cargo test --workspace --no-default-features

      - name: Test library with the GUI (default features)
        run: cargo test --lib --target ${{ matrix.native }}

      # Debug only: the checking allocator doesn't exist in release. Not on
      # Windows, where Cargo.toml leaves nih-plug's assert_process_allocs off.
      - name: Real-time safety (no_alloc)
        if: runner.os != 'Windows'
        run: cargo test --no-default-features --test no_alloc --target ${{ matrix.native }}

      - name: Docs (warnings denied)
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --no-default-features --target ${{ matrix.native }}

      - name: Benchmarks compile
        if: runner.os == 'Linux'
        run: cargo bench --no-default-features --bench performance --no-run --target ${{ matrix.native }}

      - name: Smoke test offline renderer CLI
        run: cargo run --target ${{ matrix.native }} --bin render -- --suite family --out-dir "${{ runner.temp }}/corrosion-ci-render"

      - name: Validate rendered WAV artifact
        run: |
          PY="$(command -v python3 || command -v python)"
          "$PY" scripts/check_wav.py "${{ runner.temp }}/corrosion-ci-render/pipe_comparison.wav"

  # The browser build (`add-web-app`): its own workspace in web/, with a
  # NIH-plug patched for it alone. Lint, the engine and bridge tests, the
  # wasm build, then headless Chromium drives the page.
  web:
    name: web
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      CARGO_TARGET_DIR: ${{ github.workspace }}/web/target
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, x86_64-unknown-linux-gnu
          components: clippy, rustfmt

      - name: Cache Cargo registry and target dir
        uses: Swatinem/rust-cache@v2
        with:
          key: web
          workspaces: web

      - name: Patched NIH-plug
        run: ./scripts/fetch-nih-plug.sh

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (native and wasm)
        run: |
          cargo clippy -p corrosion-web-engine --all-targets -- -D warnings
          cargo clippy -p corrosion-web-engine -p corrosion-web-editor --target wasm32-unknown-unknown -- -D warnings

      - name: Engine and bridge tests (with the real-time check)
        run: cargo test -p corrosion-web-engine

      # The same script Cloudflare runs: it fetches the pinned wasm-bindgen.
      - name: Build the web app
        run: bash scripts/cloudflare-build.sh

      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Browser checks
        run: |
          python3 -m http.server 8787 --directory dist >/dev/null 2>&1 &
          sleep 1
          node scripts/smoke.cjs http://localhost:8787/
          node scripts/features.cjs http://localhost:8787/ ../presets/factory/bass/tank_boom_bass.corrosion-preset

  # VST3 and CLAP built on each platform's own runner, checked, validated and
  # zipped. Needs every platform's checks, so a release never mixes a tested
  # platform with an untested one.
  bundle:
    name: bundle (${{ matrix.platform }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            arch: x86_64
            targets: x86_64-unknown-linux-gnu
            clap_validator_asset: "*ubuntu*"
            pluginval_asset: pluginval_Linux.zip
          - platform: windows
            os: windows-latest
            arch: x86_64
            targets: x86_64-pc-windows-msvc
            clap_validator_asset: "*windows*"
            pluginval_asset: pluginval_Windows.zip
          - platform: macos
            os: macos-latest
            arch: universal
            targets: aarch64-apple-darwin, x86_64-apple-darwin
            clap_validator_asset: "*macos*"
            pluginval_asset: pluginval_macOS.zip
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libx11-dev libx11-xcb-dev libxau-dev libxcb1-dev \
            libxcursor-dev libxext-dev libxfixes-dev libxft-dev libxi-dev \
            libxinerama-dev libxkbcommon-dev libxrandr-dev libxrender-dev \
            libxtst-dev libxxf86vm-dev libgl-dev xvfb

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache Cargo registry and target dir
        uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.platform }}

      - name: Build bundles
        run: scripts/bundle.sh ${{ matrix.platform }} release

      - name: Check bundle layout
        run: scripts/check_bundle.sh ${{ matrix.platform }}

      # Pinned releases, downloaded with the run's token; added to PATH.
      - name: Install validators
        run: |
          tools="${{ runner.temp }}/validators"
          mkdir -p "$tools/clap" "$tools/pluginval"
          gh release download "$CLAP_VALIDATOR_VERSION" -R free-audio/clap-validator \
            -p "${{ matrix.clap_validator_asset }}" -D "$tools/clap"
          gh release download "$PLUGINVAL_VERSION" -R Tracktion/pluginval \
            -p "${{ matrix.pluginval_asset }}" -D "$tools/pluginval"
          for archive in "$tools"/clap/* "$tools"/pluginval/*; do
            dir="$(dirname "$archive")"
            case "$archive" in
              *.tar.gz) tar -xzf "$archive" -C "$dir" ;;
              *.zip)
                if [ "$RUNNER_OS" = Windows ]; then 7z x -y -o"$dir" "$archive" >/dev/null
                else unzip -q -o "$archive" -d "$dir"; fi ;;
            esac
          done
          # Put the directory holding each executable on PATH.
          for name in clap-validator pluginval; do
            exe="$(find "$tools" -type f \( -name "$name" -o -name "$name.exe" \) | head -1)"
            [ -n "$exe" ] || { echo "no $name executable in $tools"; find "$tools"; exit 1; }
            chmod +x "$exe"
            dirname "$exe" >> "$GITHUB_PATH"
            echo "$name: $exe"
          done

      - name: Validate (clap-validator, pluginval)
        env:
          CORROSION_REQUIRE_VALIDATORS: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # JUCE (pluginval) wants a display even without GUI tests.
            xvfb-run -a scripts/validate-plugins.sh ${{ matrix.platform }}
          else
            scripts/validate-plugins.sh ${{ matrix.platform }}
          fi

      # One zip per format, with the bundle at its root, ready to drop into
      # the plugin folder.
      - name: Package
        run: |
          base="Corrosion-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p dist
          dist="$PWD/dist"
          # The license (GPLv3) goes next to the bundle.
          cp LICENSE target/bundled/${{ matrix.platform }}/
          cd target/bundled/${{ matrix.platform }}
          for format in vst3 clap; do
            if [ "$RUNNER_OS" = Windows ]; then
              7z a -tzip "$dist/$base-$format.zip" "Corrosion.$format" LICENSE >/dev/null
            else
              zip -qry "$dist/$base-$format.zip" "Corrosion.$format" LICENSE
            fi
          done
          ls -l "$dist"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: corrosion-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  # Replace the rolling `nightly` pre-release with this commit's six zips,
  # after every job passed, on pushes to main and manual runs on main.
  nightly:
    needs: bundle
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Publishing runs never overlap; the newest publishes last.
    concurrency:
      group: nightly
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check the six zips
        run: |
          ls -l dist
          for platform in linux-x86_64 windows-x86_64 macos-universal; do
            for format in vst3 clap; do
              test -f "dist/Corrosion-$platform-$format.zip" || { echo "missing Corrosion-$platform-$format.zip"; exit 1; }
            done
          done
          test "$(ls dist/*.zip | wc -l)" -eq 6

      - name: Publish the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short="$(echo "$GITHUB_SHA" | cut -c1-7)"
          cat > notes.md <<EOF
          Automatic build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}. Replaced by every green run on main; not a stable release.

          Every bundle passed the tests on its platform, clap-validator and pluginval (strictness 5, no GUI tests). No DAW checks are automated.

          | Platform | VST3 folder | CLAP folder |
          |---|---|---|
          | Windows (x86_64) | \`C:\\Program Files\\Common Files\\VST3\` | \`C:\\Program Files\\Common Files\\CLAP\` |
          | macOS (Apple Silicon and Intel) | \`~/Library/Audio/Plug-Ins/VST3\` | \`~/Library/Audio/Plug-Ins/CLAP\` |
          | Linux (x86_64) | \`~/.vst3\` | \`~/.clap\` |

          Unzip each archive and move \`Corrosion.vst3\` or \`Corrosion.clap\` into its folder. Each zip also holds \`LICENSE\`: Corrosion is free software under the GPLv3.

          **macOS:** the bundles are ad-hoc signed, not notarized, so macOS quarantines them after a download. Before the first use, run \`xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/Corrosion.vst3\` (and the same for \`CLAP/Corrosion.clap\`).
          EOF
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/*.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly (${short})" \
            --notes-file notes.md
