[package]
name = "corrosion"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "render"
path = "src/bin/render.rs"

[[bin]]
name = "render_presets"
path = "src/bin/render_presets.rs"

[[bin]]
name = "seed_presets"
path = "src/bin/seed_presets.rs"

[[bin]]
name = "export_guide_data"
path = "src/bin/export_guide_data.rs"

[[bin]]
name = "render_guide_clips"
path = "src/bin/render_guide_clips.rs"

[dependencies]
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug", optional = true }
# The editor's egui without baseview, for the web build (`web-gui`). The same
# version nih_plug_egui uses.
egui = { version = "=0.31.1", optional = true }
# The native file dialogs behind the editor's Import and Export
# (`add-preset-import-export`), plugin GUI only. On Linux the XDG desktop
# portal, not GTK, so the bundle links no GTK and doesn't fight the host's.
rfd = { version = "0.18", optional = true, default-features = false, features = ["xdg-portal"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
include_dir = "0.7"

# Native builds keep NIH-plug's default features (the VST3 wrapper). The web
# build (wasm32, add-web-app) leaves VST3 out: it has no plugin host and no OS
# event loop.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nih-plug = { package = "nih_plug", git = "https://github.com/robbert-vdh/nih-plug" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
nih-plug = { package = "nih_plug", git = "https://github.com/robbert-vdh/nih-plug", default-features = false }

[target.'cfg(not(any(target_os = "windows", target_arch = "wasm32")))'.dependencies]
nih-plug = { package = "nih_plug", git = "https://github.com/robbert-vdh/nih-plug", features = ["assert_process_allocs"] }

[features]
default = ["gui"]
gui = ["nih_plug_egui", "dep:rfd"]
# The browser build's engine (`src/web.rs`). Builds only in the `web/`
# workspace, whose patched NIH-plug makes the parameter setters public.
web-host = []
# The browser build's editor (`src/gui/editor.rs` on plain egui, no window
# of its own). Builds only in the `web/` workspace, as `web-host`.
web-gui = ["web-host", "dep:egui"]

[dev-dependencies]
assert_no_alloc = { git = "https://github.com/robbert-vdh/rust-assert-no-alloc.git", branch = "feature/nested-permit-forbid" }
criterion = "0.5"

[[bench]]
name = "performance"
harness = false

# Debug test runs render many seconds of audio (the averaged sample-rate test
# alone is about 6 000 two-second notes). opt-level 1 keeps debug assertions and
# overflow checks while cutting the run several-fold (resolve-exciter-tradeoffs).
[profile.test]
opt-level = 1
