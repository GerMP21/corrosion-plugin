# Cloudflare Workers: serves the built web app (web/dist) as static assets
# (`add-web-app`). No server code: the whole app runs in the browser.
name = "corrosion"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"

# The public URL (maintainer's choice: a domain of their own, which must be
# a zone in the same Cloudflare account). Uncomment with the real hostname:
# routes = [{ pattern = "corrosion.example.com", custom_domain = true }]
