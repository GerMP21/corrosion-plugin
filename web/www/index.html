<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corrosion</title>
<style>
  :root { color-scheme: dark; --bg: #16130f; --fg: #e8e0d4; --muted: #8c8274; --accent: #c8642a; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 28px; letter-spacing: 0.08em; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font: inherit; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }
  #status { margin-top: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
  a { color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>CORROSION</h1>
  <p>Physical-modelling synth, running in your browser.</p>
  <button id="start">Start audio</button>
  <button id="note" disabled>Play C4</button>
  <div id="status">Audio is off. Browsers start audio only after a click.</div>
  <footer>
    Free software under the <a href="https://www.gnu.org/licenses/gpl-3.0.html">GPLv3</a>.
    <a href="https://github.com/Synaptech-Solutions-SAS/Corrosion-VST">Source code</a>.
    Build <span id="build">dev</span>.
  </footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
