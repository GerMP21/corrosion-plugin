<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corrosion</title>
<meta name="description" content="Corrosion, a physical-modelling synthesizer, running in your browser.">
<style>
  :root { color-scheme: dark; --bg: #121212; --bar: #1b1b1b; --fg: #e6e1d8; --muted: #8f8a80; --accent: #e8b400; --line: #2c2c2c; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; background: var(--bar); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 15px; letter-spacing: 0.12em; font-weight: 700; }
  header .grow { flex: 1; }
  button { background: var(--accent); color: #111; border: 0; border-radius: 4px; padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }
  #status { color: var(--muted); font-variant-numeric: tabular-nums; }
  #stage { flex: 1; display: flex; justify-content: center; align-items: flex-start; overflow: auto; }
  #editor { display: block; width: min(100vw, 1080px); aspect-ratio: 1080 / 840; outline: none; }
  footer { padding: 6px 16px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); background: var(--bar); }
  a { color: var(--fg); }
</style>
</head>
<body>
<header>
  <h1>CORROSION</h1>
  <button id="start">Start audio</button>
  <span id="status">Audio is off: browsers start audio only after a click.</span>
  <span class="grow"></span>
</header>
<div id="stage"><canvas id="editor" tabindex="0"></canvas></div>
<footer>
  Free software under the <a href="https://www.gnu.org/licenses/gpl-3.0.html">GPLv3</a> ·
  <a href="https://github.com/Synaptech-Solutions-SAS/Corrosion-VST">Source code</a> ·
  Build <span id="build">dev</span>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
